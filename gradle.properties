# Gradle build properties for Marine Watch
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false

# AndroidX — required for Wear Compose and all modern dependencies
android.useAndroidX=true

# Disable Jetifier (we have no legacy support-lib dependencies)
android.enableJetifier=false

# Kotlin
kotlin.code.style=official

# Kotlin 2.x — active le nouveau backend K2 (défaut en 2.0+, explicite ici pour clarté)
kotlin.incremental=true